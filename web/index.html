<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantry-to-Plate</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%238f5c06'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23f2f4f1'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Libre+Franklin:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Pantry-to-Plate chat. The allergen check is drawn as a food-packaging label (heavy black
   rules): it is printed by code from the declaration fields, so it looks unlike the model's prose. */
:root {
  --bg: #f2f4f1; --surface: #ffffff; --sunk: #e8ece7; --side: #e8ece6; --hover: #dde3dc; --bubble: #dfe6e0;
  --ink: #15201a; --muted: #59655e; --line: #d3dad4;
  --accent: #8f5c06; --accent-soft: #f6ead2; --safe: #1c7a4b; --safe-soft: #e1f2e8;
  --unsafe: #b3261e; --unsafe-soft: #fbe5e2; --warn: #8a5a00; --wait: #b9c2bb; --model: #2f5d50; --tool: #8f5c06;
  --f-display: "Archivo", "Arial Narrow", "Segoe UI", Arial, sans-serif;
  --f-body: "Libre Franklin", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", Consolas, ui-monospace, monospace;
  --r: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1411; --surface: #161d19; --sunk: #1d2621; --side: #121915; --hover: #1f2923; --bubble: #24302a;
    --ink: #e5ebe6; --muted: #9aa6a0; --line: #2a352f;
    --accent: #e2a542; --accent-soft: #3a2c12; --safe: #55c48c; --safe-soft: #12301f;
    --unsafe: #f2766b; --unsafe-soft: #3b1714; --warn: #e2a542; --wait: #3a4640; --model: #7fbfa9; --tool: #e2a542;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; overflow: hidden; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
code, .mono { font-family: var(--f-mono); font-size: 0.86em; }
button, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
[hidden] { display: none !important; }
.small { font-size: 13px; color: var(--muted); }
svg { flex: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 999px;
  font-family: var(--f-display); font-stretch: 85%; font-weight: 700; font-size: 11px; letter-spacing: 0.05em;
  text-transform: uppercase; border: 1px solid currentColor; white-space: nowrap; line-height: 1.5; }
.chip.safe { color: var(--safe); background: var(--safe-soft); }
.chip.unsafe { color: var(--unsafe); background: var(--unsafe-soft); }
.chip.warn { color: var(--warn); background: var(--accent-soft); }
.chip.neutral { color: var(--muted); }

/* ---------- app frame: sidebar + chat ---------- */
.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); height: 100vh; height: 100dvh; }
.sidebar { background: var(--side); border-right: 1px solid var(--line); display: grid;
  grid-template-rows: auto auto auto minmax(0, 1fr) auto; min-height: 0; }
.sb-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 16px 14px 10px; }
.brand { font-family: var(--f-display); font-stretch: 72%; font-weight: 850; font-size: 23px; letter-spacing: -0.01em;
  line-height: 1; text-transform: uppercase; }
.brand span { color: var(--accent); }
.new-chat { display: flex; align-items: center; gap: 9px; margin: 2px 10px 10px; padding: 9px 12px; border: 1px solid var(--line);
  background: var(--surface); border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; text-align: left; }
.new-chat:hover { border-color: var(--muted); }
.tabs { display: flex; gap: 4px; margin: 0 10px 4px; padding: 3px; background: var(--hover); border-radius: 9px; }
.tab { flex: 1; border: 0; background: none; padding: 5px 8px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); }
.sb-list { overflow-y: auto; padding: 4px 8px 14px; min-height: 0; }
.group-h { font-family: var(--f-display); font-stretch: 85%; font-weight: 700; font-size: 11px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--muted); padding: 14px 8px 4px; }
.chat-item { display: flex; align-items: center; border-radius: 8px; }
.chat-item:hover { background: var(--hover); }
.chat-item[aria-current="true"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.chat-open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; text-align: left; border: 0; background: none;
  padding: 7px 10px; cursor: pointer; font-size: 14px; }
.chat-open .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-del { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 5px 7px; margin-right: 3px; border-radius: 6px;
  opacity: 0; display: flex; align-items: center; font-size: 12px; font-weight: 700; }
.chat-item:hover .chat-del, .chat-del:focus-visible, .chat-del.armed { opacity: 1; }
.chat-del:hover { color: var(--unsafe); }
.chat-del.armed { color: #fff; background: var(--unsafe); }
@media (hover: none) { .chat-del { opacity: 0.7; } }
.dot-live { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
@media (prefers-reduced-motion: no-preference) { .dot-live { animation: pulse 1.2s ease-in-out infinite; } @keyframes pulse { 50% { opacity: 0.25; } } }
.sb-empty, .sb-note { font-size: 13px; color: var(--muted); padding: 10px 8px; margin: 0; }
.log-item { width: 100%; text-align: left; border: 0; background: none; border-radius: 8px; padding: 8px 10px; cursor: pointer; display: grid; gap: 3px; }
.log-item:hover { background: var(--hover); }
.log-item[aria-current="true"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.log-q { font-size: 13.5px; line-height: 1.35; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.log-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11.5px; color: var(--muted); font-family: var(--f-mono); }
.redact { background: var(--ink); color: var(--bg); padding: 0 4px; border-radius: 2px; font-family: var(--f-body); font-size: 0.92em; }
.sb-foot { padding: 10px 14px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: flex-start; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); min-width: 0; }
.icon-btn { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 6px; border-radius: 7px; display: grid; place-items: center; }
.icon-btn:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
.icon-btn:disabled { opacity: 0.35; cursor: default; }
.menu-btn { display: none; }
.title { flex: 1; min-width: 0; font-family: var(--f-display); font-stretch: 92%; font-weight: 700; font-size: 16px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.pill { font-family: var(--f-mono); font-size: 12px; padding: 2px 9px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--sunk); white-space: nowrap; }
.pill b { font-weight: 600; color: var(--accent); }
.banner { background: var(--unsafe-soft); color: var(--unsafe); border-bottom: 1px solid var(--unsafe); padding: 9px 16px; font-size: 14px; }

/* ---------- thread ---------- */
.thread { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
.thread-in { max-width: 800px; margin: 0 auto; padding: 26px 16px 36px; display: grid; gap: 22px; }
.u { display: flex; justify-content: flex-end; }
.bubble { max-width: min(85%, 640px); background: var(--bubble); padding: 10px 16px; border-radius: 18px 18px 4px 18px;
  white-space: pre-wrap; overflow-wrap: anywhere; }
.b { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: start; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; margin-top: 1px; }
.b-main { display: grid; gap: 12px; min-width: 0; }

/* steps: what the agent did */
.work-sum { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 2px 0; cursor: pointer;
  font-size: 13px; color: var(--muted); text-align: left; }
.work-sum:hover { color: var(--ink); }
.work-sum svg { transition: transform 0.15s; }
.work-sum[aria-expanded="true"] svg { transform: rotate(90deg); }
.steps { list-style: none; margin: 4px 0 0; padding: 2px 0 2px 12px; border-left: 2px solid var(--line); display: grid; gap: 5px; }
.step { display: flex; align-items: baseline; gap: 8px; font-size: 13.5px; color: var(--muted); min-width: 0; }
.step-ic { color: var(--tool); align-self: center; display: flex; }
.step-t { min-width: 0; overflow-wrap: anywhere; }
.step-ms { margin-left: auto; font-family: var(--f-mono); font-size: 11.5px; white-space: nowrap; padding-left: 8px; }
.step.err .step-t { color: var(--unsafe); }
.step.thinking .step-t { color: var(--ink); }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--model); border-radius: 50%; flex: none; align-self: center; }
@media (prefers-reduced-motion: no-preference) {
  .spin { animation: spin 0.8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
  .shimmer { background: linear-gradient(90deg, var(--muted) 0 40%, var(--ink) 50%, var(--muted) 60% 100%) 0 0 / 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent !important; animation: shimmer 1.6s linear infinite; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
}

/* answer */
.answer-body { overflow-wrap: break-word; }
.answer-body > :first-child { margin-top: 0; }
.answer-body p { margin: 0 0 10px; }
.answer-body p:last-child, .answer-body ul:last-child { margin-bottom: 0; }
.answer-body h4 { font-size: 15px; font-stretch: 90%; margin: 14px 0 6px; }
.answer-body ul { margin: 0 0 10px; padding-left: 20px; }
.answer-body code { background: var(--sunk); padding: 1px 5px; border-radius: 3px; }
.answer-body.streaming > :last-child::after { content: ""; display: inline-block; width: 7px; height: 1em; margin-left: 3px;
  vertical-align: -2px; background: var(--ink); border-radius: 1px; }
@media (prefers-reduced-motion: no-preference) { .answer-body.streaming > :last-child::after { animation: blink 1s steps(2) infinite; } @keyframes blink { 50% { opacity: 0; } } }
.cite { display: inline; margin: 0 2px; padding: 0 6px 0 0; border-radius: 4px; font-family: var(--f-mono); font-size: 11.5px;
  background: var(--sunk); border: 1px solid var(--line); color: var(--ink); text-decoration: none; white-space: nowrap;
  -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.cite .n { display: inline-block; padding: 0 5px; margin-right: 4px; background: var(--line); border-radius: 3px 0 0 3px; font-weight: 600; }
.cite .ver { color: var(--accent); font-weight: 600; }
.cite .sec { color: var(--muted); margin-left: 4px; }
.cite.pending { padding-left: 6px; color: var(--muted); }
a.cite:hover { border-color: var(--muted); }
.cite.superseded { border-color: var(--unsafe); background: var(--unsafe-soft); }
.cite.superseded .ver { color: var(--unsafe); }
.cite.broken { border-style: dashed; border-color: var(--warn); padding-left: 6px; }
.cite.broken b { color: var(--warn); font-family: var(--f-body); font-size: 10.5px; }
@media (max-width: 520px) { .cite { white-space: normal; overflow-wrap: anywhere; } }
.sources { list-style: none; margin: 0; padding: 10px 0 0; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.sources li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; font-size: 12.5px; border-radius: 4px; }
.sources li:target { background: var(--accent-soft); }
.sources .n { font-family: var(--f-mono); font-weight: 600; color: var(--muted); }
.sources .id { font-family: var(--f-mono); overflow-wrap: anywhere; }
.sources .where { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.broken-note { margin: 0; font-size: 13px; color: var(--warn); }
.errbox { border: 1px solid var(--unsafe); background: var(--unsafe-soft); color: var(--unsafe); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
.from-log { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; border: 1px solid var(--line); border-left: 3px solid var(--accent);
  background: var(--surface); border-radius: 8px; padding: 10px 12px; }
.from-log a { color: var(--accent); font-weight: 600; }

/* actions under an answer */
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; margin-left: -6px; }
.act { display: inline-flex; align-items: center; gap: 5px; border: 0; background: none; cursor: pointer; color: var(--muted);
  padding: 5px 7px; border-radius: 7px; font-size: 13px; font-weight: 600; }
.act:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
.act:disabled { opacity: 0.4; cursor: default; }
.act[aria-expanded="true"] { color: var(--ink); background: var(--hover); }
.vers { display: inline-flex; align-items: center; gap: 0; font-size: 12.5px; color: var(--muted); margin-right: 4px; }
.vers .icon-btn { padding: 3px 8px; font-size: 19px; line-height: 1; }
.meta { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); margin-left: 6px; }
.regen-tag { font-size: 12px; color: var(--accent); font-weight: 600; }

/* the food label */
.label { border: 3px solid var(--ink); border-radius: 2px; background: var(--surface); padding: 8px 14px 10px; }
.label-h { font-family: var(--f-display); font-stretch: 68%; font-weight: 900; font-size: 22px; text-transform: uppercase;
  line-height: 1; padding-bottom: 5px; border-bottom: 7px solid var(--ink); }
.label-src { font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--ink); }
.label-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--ink); }
.label-row:last-child { border-bottom: 0; padding-bottom: 0; }
.label-id { font-family: var(--f-mono); font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.label-why { font-size: 13px; color: var(--muted); margin-top: 2px; }
.verdict { font-family: var(--f-display); font-stretch: 75%; font-weight: 850; font-size: 15px; letter-spacing: 0.02em;
  padding: 3px 9px; border: 2px solid currentColor; white-space: nowrap; text-align: center; }
.verdict.safe { color: var(--safe); }
.verdict.unsafe { color: var(--unsafe); }
.verdict.warn { color: var(--warn); }
.verdict.neutral { color: var(--muted); }
@media (max-width: 520px) { .label-row { grid-template-columns: minmax(0, 1fr); } .verdict { justify-self: start; } }

/* trace */
.trace { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 12px 14px; }
.trace-h { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.trace-h b { font-family: var(--f-display); font-size: 15px; }
.copy { border: 0; background: none; padding: 0; cursor: pointer; color: var(--accent); font-size: 12px; font-weight: 600; }
.wf-scroll { overflow-x: auto; margin-top: 10px; }
.wf-grid { min-width: 600px; }
.wf-row { display: grid; grid-template-columns: 230px minmax(0, 1fr) 74px; gap: 10px; align-items: center; min-height: 30px; padding: 3px 0; }
.wf-name { font-family: var(--f-mono); font-size: 12px; min-width: 0; }
.wf-name .args { display: block; font-family: var(--f-body); font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wf-row.server .wf-name { padding-left: 14px; color: var(--muted); }
.wf-row.err .wf-name { color: var(--unsafe); }
.wf-track { position: relative; height: 14px; background: linear-gradient(var(--line), var(--line)) center / 100% 1px no-repeat; }
.wf-bar { position: absolute; top: 0; height: 14px; border-radius: 2px; min-width: 3px; display: flex; overflow: hidden; }
.wf-row.server .wf-bar { top: 4px; height: 6px; opacity: 0.6; }
.wf-wait { background: repeating-linear-gradient(135deg, var(--wait) 0 4px, transparent 4px 7px); border: 1px solid var(--wait); }
.wf-model { background: var(--model); flex: 1; }
.wf-tool { background: var(--tool); }
.wf-ms { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); text-align: right; }
.wf-axis { display: grid; grid-template-columns: 230px minmax(0, 1fr) 74px; gap: 10px; margin-top: 6px; }
.wf-ticks { position: relative; height: 16px; font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); }
.wf-ticks span { position: absolute; transform: translateX(-50%); }
.wf-ticks span:first-child { transform: none; }
.wf-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.sw { display: inline-block; width: 18px; height: 10px; vertical-align: -1px; margin-right: 5px; border-radius: 2px; }
.trace-notes { display: grid; gap: 4px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.trace-notes b { color: var(--ink); font-weight: 600; }
.trace-notes code { overflow-wrap: anywhere; }

/* welcome */
.welcome { display: grid; justify-items: center; text-align: center; gap: 12px; padding-top: min(12vh, 90px); }
.w-mark { width: 52px; height: 52px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
.welcome h1 { font-stretch: 80%; font-weight: 850; font-size: clamp(28px, 4.4vw, 40px); line-height: 1.05; text-transform: uppercase; letter-spacing: -0.01em; }
.welcome p { margin: 0; max-width: 56ch; color: var(--muted); }
.suggest { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 640px; margin-top: 14px; }
@media (max-width: 560px) { .suggest { grid-template-columns: minmax(0, 1fr); } }
.sg { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: grid; gap: 2px; }
.sg:hover:not(:disabled) { border-color: var(--muted); }
.sg:disabled { opacity: 0.5; cursor: default; }
.sg b { font-size: 14px; }
.sg span { font-size: 13px; color: var(--muted); }

/* composer */
.composer { padding: 6px 16px 12px; }
.composer-in { max-width: 800px; margin: 0 auto; }
.cbox { display: flex; align-items: flex-end; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px;
  padding: 7px 7px 7px 18px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06); }
.cbox:focus-within { border-color: var(--muted); }
.cbox textarea { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; resize: none; max-height: 200px; padding: 7px 0;
  font-size: 15.5px; line-height: 1.45; }
.send { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg); display: grid; place-items: center; cursor: pointer; flex: none; }
.send:disabled { opacity: 0.3; cursor: default; }
.cnote { text-align: center; font-size: 12px; color: var(--muted); margin: 6px 0 0; }

.scrim { display: none; }
@media (max-width: 899px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 20; transform: translateX(-102%); transition: transform 0.2s; box-shadow: 0 0 30px rgba(0, 0, 0, 0.25); }
  .sidebar.open { transform: none; }
  .scrim.open { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); z-index: 19; }
  .menu-btn { display: grid; }
  .pill.opt { display: none; }
  .meta { flex-basis: 100%; margin-left: 7px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Chats">
    <div class="sb-head">
      <div class="brand">Pantry-to-<span>Plate</span></div>
      <button class="icon-btn menu-btn" id="close-side" type="button" aria-label="Close menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <button class="new-chat" id="new-chat" type="button"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>New chat</button>
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-chats" type="button" role="tab" aria-selected="true">Chats</button>
      <button class="tab" id="tab-log" type="button" role="tab" aria-selected="false">Log</button>
    </div>
    <div class="sb-list" id="sb-list"></div>
    <div class="sb-foot"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="margin-top:2px"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
      <span>Chats are saved in this browser only. The server's log removes health details.</span></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="open-side" type="button" aria-label="Open chats"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="title" id="title">New chat</div>
      <div class="pills" id="pills"><span class="pill">connecting…</span></div>
    </header>
    <div class="banner" id="banner" hidden></div>
    <div class="thread" id="thread"><div class="thread-in" id="thread-in"></div></div>
    <form class="composer" id="composer">
      <div class="composer-in">
        <div class="cbox">
          <textarea id="q" rows="1" maxlength="1000" placeholder="Ask about a recipe, an allergy, scaling…" aria-label="Message"></textarea>
          <button class="send" id="send" type="submit" aria-label="Send" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
        <p class="cnote">Allergen verdicts are printed by code from the recipe declarations. Enter sends, Shift+Enter adds a line.</p>
      </div>
    </form>
  </main>
</div>
<div id="status" class="small" role="status" aria-live="polite" style="position:absolute;left:-9999px"></div>

<script>
const EXAMPLES = [
  ["Nut allergy", "Can my son have the nankhatai?", "My son is allergic to nuts - can he have the nankhatai?"],
  ["Dinner in 25 minutes", "Leftover rice, lemons, a nut allergy", "I've got leftover cooked rice, two lemons and mustard seeds. My kid is allergic to nuts and I have 25 minutes - what can I make?"],
  ["Scale it up", "4× nankhatai for a school fair", "I need 4 times the nankhatai for a school fair. How much maida do I need, and how long do I bake them?"],
  ["Egg allergy", "Is the nankhatai egg-safe?", "Is the nankhatai safe for someone with an egg allergy?"],
];
const VERDICT = {
  SAFE_BY_DECLARATION: ["safe", "SAFE BY DECLARATION"],
  UNSAFE: ["unsafe", "UNSAFE"],
  MAY_CONTAIN: ["warn", "MAY CONTAIN"],
  SUPERSEDED_NOT_OFFERED: ["neutral", "OLD VERSION · NOT OFFERED"],
};
const svg = (d, w = 15) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON = {
  plate: `<svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" fill="none" stroke="#fff" stroke-width="2.4"/><circle cx="12" cy="12" r="2.6" fill="#fff"/></svg>`,
  search: svg('<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>', 13),
  shield: svg('<path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/>', 13),
  book: svg('<path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 19V5"/>', 13),
  swap: svg('<path d="M7 7h12l-3-3M17 17H5l3 3"/>', 13),
  scale: svg('<path d="M4 20L20 4M14 4h6v6"/>', 13),
  temp: svg('<path d="M14 14.8V4a2 2 0 00-4 0v10.8a4 4 0 104 0z"/>', 13),
  tool: svg('<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>', 13),
  chev: svg('<path d="M9 6l6 6-6 6"/>', 13),
  copy: svg('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 012-2h8"/>'),
  regen: svg('<path d="M20 11a8 8 0 10-2.3 5.7"/><path d="M20 4v7h-7"/>'),
  trace: svg('<path d="M4 6h9M4 12h14M4 18h6"/>'),
  trash: svg('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>', 14),
  log: svg('<path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/>', 16),
};

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtMs = ms => ms >= 1000 ? (ms / 1000).toFixed(1) + " s" : Math.round(ms) + " ms";
const sum = (a, f) => a.reduce((t, x) => t + (f(x) || 0), 0);
const fmtArgs = args => Object.entries(args || {}).map(([k, v]) => `${k}: ${Array.isArray(v) ? v.join(", ") : typeof v === "object" ? JSON.stringify(v) : v}`).join(" · ");
const when = ts => { const d = new Date(ts); return isNaN(d) ? ts : d.toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); };
const rid = () => Math.random().toString(16).slice(2, 12);

let USER = "web-user";
try {
  USER = localStorage.getItem("pantry-user") || "";
  if (!USER) { USER = "web-" + Math.random().toString(16).slice(2, 10); localStorage.setItem("pantry-user", USER); }
} catch (e) { USER = "web-user"; }

/* ---------- chats, kept in this browser ----------
   chat = { id, title, created, updated, turns: [{ q, sel, versions: [version] }] }
   version = { status: running | done | error, record, error, temperature, ... }
   Regenerate adds a version to the last turn; the selected version of every turn is what the
   next question sends back as history, so the conversation continues from what is on screen. */
const STORE = "pantry.chats.v1", MAX_CHATS = 60;
let chats = [], currentId = null, logT = null, busy = false, hasKey = true, REGEN_T = 0.7, tab = "chats";

function loadChats() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE) || "{}");
    chats = Array.isArray(s.chats) ? s.chats : [];
    currentId = s.currentId || null;
  } catch (e) { chats = []; }
  for (const c of chats) for (const t of c.turns) for (const v of t.versions)
    if (v.status === "running") Object.assign(v, { status: "error", error: "Interrupted: the page was closed before the answer arrived. It may be in the Log tab." });
  if (!chats.some(c => c.id === currentId)) currentId = null;
}
function saveChats() {
  const keep = v => v.status === "done"
    ? { status: "done", record: v.record, firstMs: v.firstMs, temperature: v.temperature }
    : { status: v.status, error: v.error, steps: v.steps, temperature: v.temperature };
  for (;;) {
    const data = JSON.stringify({ currentId, chats: chats.slice(0, MAX_CHATS).map(c => ({ ...c,
      turns: c.turns.map(t => ({ q: t.q, sel: t.sel, versions: t.versions.map(keep) })) })) });
    try { localStorage.setItem(STORE, data); return; }
    catch (e) { if (e.name === "QuotaExceededError" && chats.length > 1) chats.pop(); else return; }  // oldest chat goes first
  }
}
const current = () => chats.find(c => c.id === currentId) || null;
function historyFor(chat, i) {
  return chat.turns.slice(0, i).map(t => {
    const v = t.versions[t.sel];
    return v && v.status === "done" && v.record.answer ? { question: t.q, answer: v.record.answer } : null;
  }).filter(Boolean);
}

/* ---------- header ---------- */
async function loadInfo() {
  try {
    const info = await (await fetch("/api/info")).json();
    hasKey = info.has_key; REGEN_T = info.regen_temperature ?? REGEN_T;
    $("#pills").innerHTML = `
      <span class="pill opt" title="ask.DEFAULT_MODEL">model <b>${esc(info.model)}</b></span>
      <span class="pill" title="PANTRY_RELEASE in pantry_mcp.json">release <b>${esc(info.release)}</b></span>
      <span class="pill opt" title="${esc(info.tools.join("\n"))}"><b>${info.tools.length}</b> tools · <b>${info.servers}</b> MCP servers</span>`;
    if (!hasKey) showBanner("No model key found. Create a file named .env in the week3-rag folder containing GEMINI_API_KEY=your-key, then restart python pantry.py web. The Log tab still works.");
  } catch (e) {
    $("#pills").innerHTML = `<span class="pill">server not reachable</span>`;
    showBanner("Can't reach the Pantry-to-Plate server. Is python pantry.py web still running?");
  }
  syncSend(); renderThread();
}
function showBanner(text) { $("#banner").textContent = text; $("#banner").hidden = false; }

/* ---------- sidebar ---------- */
function groupOf(ts) {
  const now = new Date(), start = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime(), day = 864e5;
  return ts >= start ? "Today" : ts >= start - day ? "Yesterday" : ts >= start - 7 * day ? "Previous 7 days" : "Older";
}
function renderSidebar() {
  $("#tab-chats").setAttribute("aria-selected", String(tab === "chats"));
  $("#tab-log").setAttribute("aria-selected", String(tab === "log"));
  if (tab === "log") { renderLogList(); return; }
  const items = chats.filter(c => c.turns.length);
  if (!items.length) { $("#sb-list").innerHTML = `<p class="sb-empty">Your chats appear here.</p>`; return; }
  let html = "", last = "";
  for (const c of items) {
    const g = groupOf(c.updated);
    if (g !== last) { html += `<div class="group-h">${g}</div>`; last = g; }
    const live = c.turns.some(t => t.versions.some(v => v.status === "running"));
    html += `<div class="chat-item" aria-current="${c.id === currentId && !logT}">
      <button class="chat-open" type="button" data-open="${esc(c.id)}" title="${esc(c.title)}">${live ? '<span class="dot-live"></span>' : ""}<span class="t">${esc(c.title)}</span></button>
      ${live ? "" : `<button class="chat-del" type="button" data-del="${esc(c.id)}" aria-label="Delete chat">${ICON.trash}</button>`}</div>`;
  }
  $("#sb-list").innerHTML = html;
}
async function renderLogList() {
  $("#sb-list").innerHTML = `<p class="sb-empty">Loading…</p>`;
  try {
    const rows = await (await fetch("/api/history")).json();
    if (tab !== "log") return;
    $("#sb-list").innerHTML = `<p class="sb-note">Read back from <code>logs/pantry_requests.jsonl</code>, as written: health details removed, user ids pseudonymised.</p>`
      + (rows.length ? rows.map(r => {
        let chip = "";
        if (r.not_run) chip = `<span class="chip unsafe">not checked</span>`;
        else if (r.verdicts.length) chip = `<span class="chip neutral">${r.verdicts.length} check${r.verdicts.length > 1 ? "s" : ""}</span>`;
        if (r.stop_reason !== "completed") chip += `<span class="chip warn">budget stop</span>`;
        return `<button class="log-item" type="button" data-trace="${esc(r.trace_id)}" aria-current="${logT?.versions[0].record.trace_id === r.trace_id}">
          <span class="log-q">${inlineText(r.question)}</span>
          <span class="log-meta"><span>${esc(when(r.ts))}</span><span>${r.laps} calls</span>${chip}</span></button>`;
      }).join("") : `<p class="sb-empty">Nothing logged yet.</p>`);
  } catch (e) { $("#sb-list").innerHTML = `<p class="sb-empty">Couldn't read the log.</p>`; }
}
function openSide(on) { $("#sidebar").classList.toggle("open", on); $("#scrim").classList.toggle("open", on); }
function openChat(id) { currentId = id; logT = null; saveChats(); renderSidebar(); renderThread(); scrollBottom(); openSide(false); }
function startNewChat() { currentId = null; logT = null; renderSidebar(); renderThread(); openSide(false); $("#q").focus(); }
function deleteChat(id) { chats = chats.filter(c => c.id !== id); if (currentId === id) currentId = null; saveChats(); renderSidebar(); renderThread(); }
async function openLog(id) {
  try {
    const res = await fetch("/api/trace/" + encodeURIComponent(id));
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    logT = { q: data.question, sel: 0, versions: [{ status: "done", record: data, ui: {} }] };
    renderSidebar(); renderThread(); $("#thread").scrollTop = 0; openSide(false);
  } catch (e) { showBanner("Couldn't open that trace: " + e.message); }
}

/* ---------- asking ---------- */
function send(question) {
  if (busy || !hasKey) return;
  logT = null;
  let chat = current();
  if (!chat) {
    chat = { id: "c-" + rid(), title: question.replace(/\s+/g, " ").slice(0, 70), created: Date.now(), updated: Date.now(), turns: [] };
    chats.unshift(chat); currentId = chat.id;
  }
  chat.turns.push({ q: question, sel: 0, versions: [] });
  run(chat, chat.turns.length - 1, false);
}
async function run(chat, i, regenerate) {
  const t = chat.turns[i];
  const v = { status: "running", steps: [], checks: [], text: "", lap: 0, started: Date.now(), temperature: regenerate ? REGEN_T : 0, ui: {} };
  t.versions.push(v); t.sel = t.versions.length - 1;
  chat.updated = Date.now(); chats = [chat, ...chats.filter(c => c !== chat)];
  busy = true; syncSend(); saveChats(); renderSidebar(); renderThread(); scrollBottom();
  let frame = 0;
  const paint = () => { if (!frame) frame = requestAnimationFrame(() => { frame = 0; paintBot(chat, i); }); };
  const tick = setInterval(paint, 1000);
  const t0 = performance.now();
  try {
    const res = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: t.q, user: USER, conversation_id: chat.id, history: historyFor(chat, i), regenerate }) });
    if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || res.statusText); }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let k;
      while ((k = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, k); buf = buf.slice(k + 1);
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === "tool") { v.steps.push(ev); if (ev.result) v.checks.push(ev.result); v.text = ""; }
        else if (ev.type === "token") {
          if (ev.lap !== v.lap) { v.lap = ev.lap; v.text = ""; }
          if (ev.text == null) v.text = "";  // the stream broke and the lap is re-run
          else { v.text += ev.text; if (v.firstMs == null) v.firstMs = performance.now() - t0; }
        }
        else if (ev.type === "done") Object.assign(v, { status: "done", record: ev.record });
        else if (ev.type === "error") throw new Error(ev.message);
        paint();
      }
    }
    if (v.status !== "done") throw new Error("The connection closed before the answer arrived. It may be in the Log tab.");
    $("#status").textContent = "Answer ready.";
  } catch (e) {
    Object.assign(v, { status: "error", error: e.message });
  } finally {
    clearInterval(tick); if (frame) cancelAnimationFrame(frame);
    busy = false; syncSend(); saveChats(); renderSidebar();
    if (chat.id === currentId && !logT) { const th = $("#thread"), top = th.scrollTop; renderThread(); th.scrollTop = top; }
  }
}
function syncSend() {
  $("#send").disabled = busy || !hasKey || !$("#q").value.trim();
  $("#q").placeholder = !hasKey ? "Add a model key to ask questions" : busy ? "Answering… you can type your next question" : "Ask about a recipe, an allergy, scaling…";
}

/* ---------- the thread ---------- */
function scrollBottom() { const th = $("#thread"); th.scrollTop = th.scrollHeight; }
function renderThread() {
  const chat = current();
  $("#title").textContent = logT ? "From the log" : chat ? chat.title : "New chat";
  if (logT) {
    $("#thread-in").innerHTML = `<div class="from-log">${ICON.log}<div><b>Read back from the log.</b> Health details were removed when it was written,
      and user <span class="mono">${esc(logT.versions[0].record.user)}</span> is pseudonymised. <a href="#" data-act="new">Start a new chat</a></div></div>
      <div class="u"><div class="bubble">${inlineText(logT.q)}</div></div>
      <div class="b" data-i="log">${botHtml(logT, { pfx: "log", last: false, log: true })}</div>`;
    return;
  }
  if (!chat || !chat.turns.length) { $("#thread-in").innerHTML = welcomeHtml(); return; }
  $("#thread-in").innerHTML = chat.turns.map((t, i) => `
    <div class="u"><div class="bubble">${esc(t.q)}</div></div>
    <div class="b" data-i="${i}">${botHtml(t, { pfx: `${i}-${t.sel}`, last: i === chat.turns.length - 1 })}</div>`).join("");
}
function paintBot(chat, i) {
  if (chat.id !== currentId || logT) return;
  const el = $(`.b[data-i="${i}"]`); if (!el) return;
  const th = $("#thread"), near = th.scrollHeight - th.scrollTop - th.clientHeight < 160;
  const t = chat.turns[i];
  el.innerHTML = botHtml(t, { pfx: `${i}-${t.sel}`, last: i === chat.turns.length - 1 });
  if (near) th.scrollTop = th.scrollHeight;
}
function welcomeHtml() {
  return `<div class="welcome"><div class="w-mark">${ICON.plate.replace(/18/g, "28")}</div><h1>What are we cooking?</h1>
    <p>Answers come only from the publisher's recipe library, cited by recipe <em>and</em> version. Allergens are checked against the declaration fields, not the page text.</p>
    <div class="suggest">${EXAMPLES.map(([h, sub, q]) => `<button class="sg" type="button" data-q="${esc(q)}" ${busy || !hasKey ? "disabled" : ""}><b>${esc(h)}</b><span>${esc(sub)}</span></button>`).join("")}</div></div>`;
}
function botHtml(t, o) {
  const v = t.versions[t.sel];
  let body;
  if (v.status === "running") body = runningHtml(v, o);
  else if (v.status === "error") body = (v.steps?.length ? `<ol class="steps">${v.steps.map(liveStep).map(stepLi).join("")}</ol>` : "")
    + `<div class="errbox"><b>Something went wrong.</b> ${esc(v.error)}</div>` + actionsHtml(t, v, o);
  else body = doneHtml(t, v, o);
  return `<div class="avatar" aria-hidden="true">${ICON.plate}</div><div class="b-main">${body}</div>`;
}

/* steps: what the agent did, in plain words */
const STEP = {
  search_recipes: a => ["search", `Searched the library for “${a.query ?? ""}”`],
  get_recipe: a => ["book", `Opened ${a.recipe_id}${ver(a)}`],
  check_allergens: a => ["shield", `Checked ${a.recipe_id}${ver(a)} for ${(a.avoid || []).join(", ")}${a.swap_from?.length ? ", as substituted" : ""}`],
  find_substitutes: a => ["swap", `Looked up ${a.allergen} swaps for ${a.recipe_id}`],
  scale_recipe: a => ["scale", `Scaled ${a.recipe_id} ×${a.factor}`],
  get_safe_temperature: a => ["temp", `Looked up the safe temperature for ${a.food}`],
};
const ver = a => a.version && a.version !== "current" ? "@" + a.version : "";
function stepOf(qualified, args, extra) {
  const [server, tool] = qualified.includes("__") ? qualified.split("__") : ["", qualified];
  const [icon, text] = STEP[tool] ? STEP[tool](args || {}) : ["tool", `${server} · ${tool}(${fmtArgs(args)})`];
  return { icon, text, ...extra };
}
const liveStep = ev => stepOf(ev.name, ev.args, { err: ev.is_error, verdict: ev.result?.verdict });
function recordSteps(r) {
  const checks = [...(r.allergen_checks || [])];
  return r.spans.filter(s => s.kind === "tool").map(s => stepOf(s.name.replace(/^tool\//, ""), s.args, {
    err: s.is_error, ms: s.latency_ms, verdict: s.tool === "check_allergens" && !s.is_error ? checks.shift()?.verdict : null }));
}
function verdictChip(v) { const [cls, word] = VERDICT[v] || ["neutral", v]; return `<span class="chip ${cls}">${esc(word)}</span>`; }
const stepLi = s => `<li class="step${s.err ? " err" : ""}"><span class="step-ic">${ICON[s.icon]}</span><span class="step-t">${esc(s.text)}${s.err ? " <b>→ error</b>" : ""}${s.verdict ? " → " + verdictChip(s.verdict) : ""}</span>${s.ms != null ? `<span class="step-ms">${fmtMs(s.ms)}</span>` : ""}</li>`;
function workSummary(steps) {
  const n = {};
  steps.forEach(s => { n[s.icon] = (n[s.icon] || 0) + 1; });
  const words = { search: "searched", shield: "checked allergens", book: "opened a recipe", swap: "looked up swaps", scale: "scaled", temp: "checked a temperature", tool: "used a tool" };
  return Object.entries(n).map(([k, c]) => words[k] + (c > 1 ? ` ×${c}` : "")).join(", ");
}

function runningHtml(v, o) {
  const secs = Math.max(0, Math.round((Date.now() - v.started) / 1000));
  const thinking = v.text ? "" : `<li class="step thinking"><span class="spin"></span><span class="step-t"><span class="shimmer">${v.steps.length ? "Reading what it found" : "Thinking"}…</span> <span class="mono small">${secs} s</span></span></li>`;
  const live = { allergen_checks: v.checks, constraints_detected: [],
    spans: v.steps.filter(s => s.is_error && s.name.endsWith("__check_allergens")).map(s => ({ tool: "check_allergens", is_error: true, args: s.args, error: s.error })) };
  return `<ol class="steps">${v.steps.map(liveStep).map(stepLi).join("")}${thinking}</ol>${labelHtml(live)}`
    + (v.text ? `<div class="answer-body streaming">${renderAnswer(v.text, { index: new Map(), broken: new Set(), pending: true, pfx: o.pfx })}</div>` : "");
}
function doneHtml(t, v, o) {
  const r = v.record, ui = v.ui || (v.ui = {});
  const ctx = { index: new Map(r.sources.map((s, n) => [s.id, { ...s, n: n + 1 }])), broken: new Set(), pfx: o.pfx };
  const answer = r.answer ? renderAnswer(r.answer, ctx) : `<p class="small">No answer: ${esc(r.stop_reason)}</p>`;
  const steps = recordSteps(r);
  const work = steps.length ? `<div><button class="work-sum" type="button" data-act="work" aria-expanded="${!!ui.work}">${ICON.chev}Worked for ${fmtMs(r.latency_ms_total)} · ${esc(workSummary(steps))}</button>${ui.work ? `<ol class="steps">${steps.map(stepLi).join("")}</ol>` : ""}</div>` : "";
  const sources = r.sources.length ? `<ol class="sources">${r.sources.map((s, n) => `
    <li id="src-${o.pfx}-${n + 1}"><span class="n">${n + 1}</span><div><div class="id">${esc(s.id)}</div>
      <div class="small">${esc(s.title)} · version ${esc(s.version)} · ${s.status === "superseded" ? '<span class="chip unsafe">superseded</span>' : `<span class="chip neutral">${esc(s.status)}</span>`}</div>
      <div class="where">${esc(s.where)}</div></div></li>`).join("")}</ol>` : "";
  const broken = ctx.broken.size ? `<p class="broken-note">${ctx.broken.size} cited id${ctx.broken.size > 1 ? "s are" : " is"} not in the library: the model invented ${ctx.broken.size > 1 ? "them" : "it"}.</p>` : "";
  return `${work}${labelHtml(r)}<div class="answer-body">${answer}</div>${broken}${sources}${actionsHtml(t, v, o)}${ui.trace ? traceHtml(r) : ""}`;
}
function actionsHtml(t, v, o) {
  const n = t.versions.length, r = v.record;
  const vers = n > 1 ? `<span class="vers"><button class="icon-btn" type="button" data-act="prev" aria-label="Previous version" ${t.sel === 0 || busy ? "disabled" : ""}>‹</button><span class="mono">${t.sel + 1} / ${n}</span><button class="icon-btn" type="button" data-act="next" aria-label="Next version" ${t.sel === n - 1 || busy ? "disabled" : ""}>›</button></span>` : "";
  const copy = r?.answer ? `<button class="act" type="button" data-act="copy">${ICON.copy}<span>Copy</span></button>` : "";
  const regen = o.last ? `<button class="act" type="button" data-act="regen" ${busy || !hasKey ? "disabled" : ""}>${ICON.regen}${v.status === "error" ? "Retry" : "Regenerate"}</button>` : "";
  const trace = r ? `<button class="act" type="button" data-act="trace" aria-expanded="${!!v.ui?.trace}">${ICON.trace}Trace</button>` : "";
  const tag = v.temperature || r?.temperature ? `<span class="regen-tag">regenerated</span>` : "";
  return `<div class="actions">${vers}${copy}${regen}${trace}${tag}${r ? `<span class="meta">${esc(metaText(r))}</span>` : ""}</div>`;
}
function firstWords(r) {  // server side: everything before the last model call, plus that call's first streamed text
  const llm = r.spans.filter(s => s.kind === "llm"), last = llm[llm.length - 1];
  if (!last || last.first_token_ms == null) return null;
  return sum(r.spans.slice(0, r.spans.indexOf(last)), s => s.latency_ms) + last.first_token_ms;
}
function metaText(r) {
  const fw = firstWords(r), bits = [];
  if (fw != null) bits.push(`first words ${fmtMs(fw)}`);
  bits.push(`${fw != null ? "done " : ""}${fmtMs(r.latency_ms_total)}`);
  bits.push(`${r.laps} model call${r.laps === 1 ? "" : "s"}`, `$${Number(r.cost_usd_total).toFixed(5)}`);
  return bits.join(" · ");
}

/* ---------- the answer ---------- */
function inlineText(s) {
  return esc(s).replace(/\[health detail removed\]/g, '<span class="redact">health detail removed</span>');
}
const ID_PART = /^[a-z0-9-]+(?:@[a-z0-9-]+)?(?:::[a-z_]+(?:::\d+)?)?$/;
// anything that starts like recipe@version is a citation, even a malformed one such as
// nankhatai-07@reformulated-2025::<automatic> (an invented id: taxonomy mode 2)
const LOOKS_CITED = /^[a-z0-9-]+@[a-z0-9-]+/;
const unesc = s => s.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, "&");
function chip(id, ctx) {
  const [recipe, rest = ""] = id.split("@");
  const version = rest.split("::")[0], section = rest.match(/::[a-z_]+::(\d+)$/)?.[1];
  const label = rest ? `${esc(recipe)}@<span class="ver">${esc(version)}</span>${section ? `<span class="sec">§${section}</span>` : ""}` : esc(id);
  if (ctx.pending) return `<span class="cite pending" title="${esc(id)}">${label}</span>`;  // sources arrive with the finished answer
  const s = ctx.index.get(id);
  if (!s) { ctx.broken.add(id); return `<span class="cite broken" title="Not in the recipe library">${esc(id)} <b>not in library</b></span>`; }
  const sup = s.status === "superseded";
  return `<a class="cite${sup ? " superseded" : ""}" href="#src-${ctx.pfx}-${s.n}" title="${esc(id)}${sup ? " — superseded version, no longer made" : ""}"><span class="n">${s.n}</span>${label}</a>`;
}
function inline(text, ctx) {
  let h = esc(text);
  h = h.replace(/\[([^\[\]]+)\]/g, (m, inner) => {
    const parts = unesc(inner).split(",").map(p => p.trim().replace(/^`|`$/g, ""));
    if (!parts.every(p => LOOKS_CITED.test(p) || (ID_PART.test(p) && p.includes("::")))) return m;
    return parts.map(p => chip(p, ctx)).join("");
  });
  h = h.replace(/\[health detail removed\]/g, '<span class="redact">health detail removed</span>');
  h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
  return h;
}
function renderAnswer(text, ctx) {
  const out = [];
  let para = [], list = null;
  const flushPara = () => { if (para.length) { out.push("<p>" + inline(para.join(" "), ctx) + "</p>"); para = []; } };
  const flushList = () => { if (list) { out.push("<ul>" + list.map(li => "<li>" + inline(li, ctx) + "</li>").join("") + "</ul>"); list = null; } };
  for (const raw of String(text).split("\n")) {
    const line = raw.trim();
    let m;
    if (!line) { flushPara(); flushList(); }
    else if ((m = line.match(/^#{1,4}\s+(.*)$/))) { flushPara(); flushList(); out.push("<h4>" + inline(m[1], ctx) + "</h4>"); }
    else if ((m = line.match(/^(?:[*-]|\d+\.)\s+(.*)$/))) { flushPara(); (list ||= []).push(m[1]); }
    else { flushList(); para.push(line); }
  }
  flushPara(); flushList();
  return out.join("");
}

function labelHtml(r) {
  const checks = r.allergen_checks || [];
  const failed = r.spans.filter(s => s.tool === "check_allergens" && s.is_error);
  if (!checks.length && !failed.length && !(r.constraints_detected || []).length) return "";
  const rows = checks.map(c => {
    const [cls, word] = VERDICT[c.verdict] || ["neutral", c.verdict];
    const why = [];
    if (c.contains_avoided?.length) why.push("Declares " + c.contains_avoided.map(a => {
      const src = (c.sources_of_avoided || {})[a];
      return src?.length ? `${a} (${src.join(", ")})` : a; }).join(", "));
    if (c.may_contain_avoided?.length) why.push("May contain " + c.may_contain_avoided.join(", ") + ": a warning, never safe");
    if (c.as_substituted?.length) why.push("As substituted: " + c.as_substituted.map(x => `${x.from} → ${x.to}`).join(", "));
    if (c.current_version) why.push(`History only. Today's recipe ${c.current_version.cite_as}: ${(VERDICT[c.current_version.verdict] || [, c.current_version.verdict])[1]}`);
    if (c.serving_suggestions_to_leave_out) why.push("Leave out: " + Object.values(c.serving_suggestions_to_leave_out).flat().join(", "));
    if (!why.length && c.verdict === "SAFE_BY_DECLARATION") why.push("Nothing you avoid is declared");
    const status = c.status === "superseded" ? `<span class="chip unsafe">superseded</span>` : `<span class="chip neutral">${esc(c.status || "current")}</span>`;
    return `<div class="label-row"><div><div class="label-id">${esc(c.cite_as)} ${status}</div>
      <div class="label-why">Avoiding ${esc((c.avoid || []).join(", "))} · ${esc(why.join(" · "))}</div></div>
      <span class="verdict ${cls}">${esc(word)}</span></div>`;
  });
  failed.forEach(s => rows.push(`<div class="label-row"><div><div class="label-id">${esc(s.args?.recipe_id || "")}${s.args?.version ? "@" + esc(s.args.version) : ""} · avoiding ${esc((s.args?.avoid || []).join(", "))}</div>
    <div class="label-why">${esc(s.error || "The check returned an error.")}</div></div><span class="verdict warn">CANNOT CONFIRM</span></div>`));
  if ((r.constraints_detected || []).length && !checks.length && !failed.length) {
    const why = r.turn > 1
      ? `This conversation names ${esc(r.constraints_detected.join(", "))}, but no recipe was checked in this answer. Do not rely on it for an allergy.`
      : `The question names ${esc(r.constraints_detected.join(", "))}. Do not rely on this answer for an allergy.`;
    rows.push(`<div class="label-row"><div><div class="label-id">No recipe was checked</div><div class="label-why">${why}</div></div><span class="verdict unsafe">NOT RUN</span></div>`);
  }
  return `<div class="label"><div class="label-h">Allergen check</div>
    <div class="label-src">From the CMS declaration fields, exact match. Not the page text. Printed by code, not by the model.</div>${rows.join("")}</div>`;
}

function waterfall(r) {
  const spans = r.spans, total = sum(spans, s => s.latency_ms) || 1;
  const byParent = {};
  (r.server_spans || []).forEach(s => (byParent[s.parent_span_id] ||= []).push(s));
  let at = 0;
  const rows = spans.map(s => {
    const left = (at / total) * 100, width = (s.latency_ms / total) * 100;
    at += s.latency_ms;
    if (s.kind === "llm") {
      const waitPct = s.latency_ms ? ((s.throttle_wait_ms || 0) / s.latency_ms) * 100 : 0;
      const tok = (s.prompt_tokens || 0) + (s.completion_tokens || 0);
      return `<div class="wf-row"><span class="wf-name">model · lap ${s.lap}<span class="args">${tok.toLocaleString()} tokens · $${Number(s.cost_usd).toFixed(7)}${s.first_token_ms != null ? ` · first words ${fmtMs(s.first_token_ms)}` : ""}</span></span>
        <div class="wf-track"><div class="wf-bar" style="left:${left}%;width:${width}%"><span class="wf-wait" style="width:${waitPct}%"></span><span class="wf-model"></span></div></div>
        <span class="wf-ms">${fmtMs(s.latency_ms)}</span></div>`;
    }
    const kids = (byParent[s.span_id] || []).map(k => `<div class="wf-row server"><span class="wf-name">└ ${esc(k.span)}<span class="args">server side, same trace id</span></span>
        <div class="wf-track"><div class="wf-bar wf-tool" style="left:${left}%;width:${(k.latency_ms / total) * 100}%"></div></div>
        <span class="wf-ms">${fmtMs(k.latency_ms)}</span></div>`).join("");
    return `<div class="wf-row${s.is_error ? " err" : ""}"><span class="wf-name">${esc(s.name.replace(/^tool\//, ""))}<span class="args" title="${esc(fmtArgs(s.args))}">${esc(fmtArgs(s.args))}${s.is_error ? " → error" : ""}</span></span>
        <div class="wf-track"><div class="wf-bar wf-tool" style="left:${left}%;width:${width}%"></div></div>
        <span class="wf-ms">${fmtMs(s.latency_ms)}</span></div>` + kids;
  }).join("");
  const secs = total / 1000, step = secs > 120 ? 30 : secs > 40 ? 10 : secs > 10 ? 5 : secs > 4 ? 1 : 0.5;
  const ticks = [];
  for (let v = 0; v <= secs; v += step) ticks.push(`<span style="left:${(v / secs) * 100}%">${+v.toFixed(1)}s</span>`);
  return rows + `<div class="wf-axis"><span></span><div class="wf-ticks">${ticks.join("")}</div><span></span></div>`;
}
function traceHtml(r) {
  const llm = r.spans.filter(s => s.kind === "llm"), tools = r.spans.filter(s => s.kind === "tool");
  const spanMs = sum(r.spans, s => s.latency_ms), waitMs = sum(llm, s => s.throttle_wait_ms);
  const waitPct = spanMs ? Math.round((waitMs / spanMs) * 100) : 0;
  const fw = firstWords(r);
  return `<div class="trace">
    <div class="trace-h"><b>Trace</b><span class="mono">${esc(r.trace_id)}</span><button class="copy" type="button" data-copy="${esc(r.trace_id)}">copy id</button>
      <span class="small">${llm.length} model · ${tools.length} tool · ${(r.server_spans || []).length} server spans</span></div>
    <div class="wf-scroll"><div class="wf-grid">${waterfall(r)}</div></div>
    <div class="wf-legend">
      <span><i class="sw wf-wait"></i>waiting on the free tier's rate limit</span>
      <span><i class="sw" style="background:var(--model)"></i>model working</span>
      <span><i class="sw" style="background:var(--tool)"></i>MCP tool call</span>
    </div>
    <div class="trace-notes">
      ${fw != null ? `<div><b>First words after ${fmtMs(fw)}</b>, finished after ${fmtMs(r.latency_ms_total)}: the answer streamed as the model wrote it.</div>` : ""}
      <div><b>${waitPct}% of the time was waiting</b> on the free tier's rate limit.</div>
      <div><b>All of the cost is model tokens.</b> The prompt is re-sent every lap: ${llm.map(s => (s.prompt_tokens || 0).toLocaleString()).join(" → ")} tokens.</div>
      ${r.turn > 1 ? `<div><b>Follow-up:</b> the model also read ${r.turn - 1} earlier turn${r.turn > 2 ? "s" : ""} of this chat.</div>` : ""}
      ${r.temperature ? `<div><b>Regenerated at temperature ${r.temperature}.</b> The eval suite measured temperature 0.</div>` : ""}
      <div>Logged as <code>${inlineText(r.question_logged)}</code></div>
      <div>Same trace in the terminal: <code>python pantry.py trace ${esc(r.trace_id)}</code></div>
    </div></div>`;
}

/* ---------- wiring ---------- */
function autosize() { const q = $("#q"); q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 200) + "px"; }
$("#composer").addEventListener("submit", e => {
  e.preventDefault();
  const q = $("#q").value.trim();
  if (!q || busy || !hasKey) return;
  $("#q").value = ""; autosize(); send(q);
});
$("#q").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#composer").requestSubmit(); }
});
$("#q").addEventListener("input", () => { autosize(); syncSend(); });
$("#new-chat").addEventListener("click", startNewChat);
$("#tab-chats").addEventListener("click", () => { tab = "chats"; renderSidebar(); });
$("#tab-log").addEventListener("click", () => { tab = "log"; renderSidebar(); });
$("#open-side").addEventListener("click", () => openSide(true));
$("#close-side").addEventListener("click", () => openSide(false));
$("#scrim").addEventListener("click", () => openSide(false));
document.addEventListener("keydown", e => { if (e.key === "Escape") openSide(false); });
$("#sb-list").addEventListener("click", e => {
  const del = e.target.closest("[data-del]");
  if (del) {
    if (del.classList.contains("armed")) deleteChat(del.dataset.del);
    else { del.classList.add("armed"); del.textContent = "Delete"; setTimeout(() => { if (del.isConnected) renderSidebar(); }, 2500); }
    return;
  }
  const open = e.target.closest("[data-open]");
  if (open) { openChat(open.dataset.open); return; }
  const lg = e.target.closest("[data-trace]");
  if (lg) openLog(lg.dataset.trace);
});
$("#thread").addEventListener("click", async e => {
  const ex = e.target.closest("[data-q]");
  if (ex) { send(ex.dataset.q); return; }
  const cp = e.target.closest("[data-copy]");
  if (cp) { copyText(cp, cp.dataset.copy, "copy id"); return; }
  const a = e.target.closest("[data-act]");
  if (!a) return;
  const act = a.dataset.act;
  if (act === "new") { e.preventDefault(); startNewChat(); return; }
  const box = a.closest(".b"), isLog = box.dataset.i === "log", chat = current();
  const i = Number(box.dataset.i), t = isLog ? logT : chat?.turns[i];
  if (!t) return;
  const v = t.versions[t.sel];
  if (act === "copy") { copyText(a, v.record.answer, a.innerHTML); return; }
  if (act === "regen") { if (!busy && !isLog) run(chat, i, true); return; }
  if (act === "prev" || act === "next") { t.sel = Math.max(0, Math.min(t.versions.length - 1, t.sel + (act === "next" ? 1 : -1))); saveChats(); }
  else (v.ui ||= {})[act] = !v.ui[act];  // work, trace
  if (isLog) box.innerHTML = botHtml(t, { pfx: "log", last: false, log: true });
  else box.innerHTML = botHtml(t, { pfx: `${i}-${t.sel}`, last: i === chat.turns.length - 1 });
});
async function copyText(btn, text, restore) {
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
  catch (err) { btn.textContent = "Copy failed"; }
  setTimeout(() => { btn.innerHTML = restore; }, 1400);
}

loadChats();
renderSidebar(); renderThread(); scrollBottom(); loadInfo();
const traceParam = new URLSearchParams(location.search).get("trace");
if (traceParam) { tab = "log"; renderSidebar(); openLog(traceParam); }
</script>
</body>
</html>
